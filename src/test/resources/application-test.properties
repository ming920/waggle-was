# 외부 인프라(MySQL, Redis, 메일, S3) 없이 @SpringBootTest 컨텍스트를 띄우기 위한 설정

# H2
spring.datasource.url=jdbc:h2:mem:waggle;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# JWT (HMAC-SHA 키는 32바이트 이상이어야 함)
security.whitelist=/api/v1/auth/sign-up,/api/v1/auth/login,/api/v1/auth/email/**,/api/v1/auth/nickname/**,/api/v1/auth/username/**
jwt.secret=waggle-test-jwt-secret-key-at-least-32-bytes
jwt.access-exp=3600000
jwt.refresh-exp=1209600000

# Redis (실제 연결은 사용 시점에 일어남)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# mail
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@waggle.com
spring.mail.password=

# AWS S3
aws.region=ap-northeast-2
aws.s3.bucket=waggle-test-bucket
aws.credentials.access-key=test
aws.credentials.secret-key=test
aws.s3.default-profile-image-url=https://example.com/default-profile.png
